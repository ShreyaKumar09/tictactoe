

services:
  backend:
    build: ./tictactoebackend
    container_name: tictactoe-backend

    ports:
      - "8000:8000"

    volumes:
      - ./tictactoebackend:/app

    env_file:
      - ./tictactoebackend/.env

    depends_on:
      - postgres

  frontend:
    build: ./tictactoefront/tictactoe
    container_name: tictactoe-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./tictactoefront/tictactoe:/app
      - /app/node_modules

    depends_on:
      - backend

  postgres:
    image: postgres:16
    container_name: tictactoe-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: tictactoe-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data



volumes:
  postgres_data:
  redis_data:

